<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barcode 128</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111214">
<style>
  :root{
    --bg:#111214;
    --surface:#1b1c1f;
    --surface2:#232427;
    --text:#f2f2f0;
    --muted:#8a8d93;
    --accent:#e8e6df;
    --danger:#d97a6c;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:20px 20px 8px;
  }
  header h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:.2px;
  }
  main{
    flex:1;
    padding:12px 20px 100px;
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow-y:auto;
  }
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:18px;
  }
  textarea{
    width:100%;
    background:var(--surface2);
    border:none;
    border-radius:12px;
    color:var(--text);
    font-size:16px;
    padding:14px;
    resize:none;
    min-height:52px;
    font-family:inherit;
    outline:none;
  }
  textarea::placeholder{color:var(--muted);}
  .row{display:flex; gap:10px; margin-top:12px;}
  button{
    border:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    flex:1;
    transition:opacity .15s;
    -webkit-appearance:none;
    appearance:none;
    background-image:none;
    box-shadow:none;
    outline:none;
  }
  button:active{opacity:.65;}
  .btn-primary{background:var(--accent); color:#161616;}
  .btn-secondary{background:var(--surface2); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger);}
  #barcode-wrap{
    background:#fff;
    border-radius:12px;
    padding:16px 8px;
    margin-top:20px;
    display:none;
    overflow-x:auto;
    text-align:center;
  }
  #barcode-wrap.show{display:block;}
  #barcode-wrap svg{max-width:100%;}
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:4px 2px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .hist-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--surface2);
    gap:10px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-text{
    font-size:15px;
    word-break:break-all;
    flex:1;
  }
  .hist-time{
    font-size:11px;
    color:var(--muted);
    display:block;
    margin-top:2px;
  }
  .hist-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{
    background:var(--surface2);
    border:none;
    color:var(--text);
    width:34px;
    height:34px;
    min-width:34px;
    max-width:34px;
    border-radius:9px;
    cursor:pointer;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    -webkit-appearance:none;
    appearance:none;
  }
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:16px 0;}

  .search-input{
    width:100%;
    background:var(--surface2);
    border:none;
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
    margin:2px 2px 12px;
    outline:none;
    box-sizing:border-box;
    -webkit-appearance:none;
    appearance:none;
  }
  .search-input::placeholder{color:var(--muted);}

  /* Scanner overlay */
  #scan-overlay{
    position:fixed; inset:0;
    background:#000;
    display:none;
    flex-direction:column;
    z-index:50;
  }
  #scan-overlay.show{display:flex;}
  #scan-video{
    flex:1;
    width:100%;
    object-fit:cover;
  }
  #scan-video::-webkit-media-controls,
  #scan-video::-webkit-media-controls-panel,
  #scan-video::-webkit-media-controls-start-playback-button,
  #scan-video::-internal-media-controls-overlay-cast-button{
    display:none !important;
    -webkit-appearance:none;
  }
  .scan-bar{
    position:absolute;
    top:0; left:0; right:0;
    padding:16px 16px calc(16px + env(safe-area-inset-top));
    padding-top:calc(16px + env(safe-area-inset-top));
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.6),transparent);
  }
  .scan-bar span{color:#fff; font-weight:600; font-size:15px;}
  .scan-close{
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    width:36px;height:36px;
    min-width:36px;
    max-width:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    line-height:1;
    font-size:18px;
    flex:none;
  }
  .scan-frame{
    position:absolute;
    left:8%; right:8%; top:38%;
    height:24%;
    border:2px solid rgba(255,255,255,.85);
    border-radius:12px;
  }
  .scan-hint{
    position:absolute;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.8);
    font-size:13px;
  }
  .scan-ocr-bar{
    position:absolute;
    bottom:0; left:0; right:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, rgba(0,0,0,.75) 40%);
  }
  .btn-ocr{
    width:100%;
    background:rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.3);
    border-radius:12px;
    padding:13px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn-ocr:active{opacity:.65;}
  .btn-ocr:disabled{opacity:.5;}
  .toast{
    position:fixed;
    left:20px; right:20px;
    bottom:calc(24px + env(safe-area-inset-bottom));
    background:var(--surface2);
    color:var(--text);
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:.25s;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>

<header>
  <h1>Barcode · Code 128</h1>
</header>

<main>
  <div class="card">
    <textarea id="input" placeholder="Введіть текст…" rows="2"></textarea>
    <div class="row">
      <button class="btn-primary" id="genBtn">Створити код</button>
      <button class="btn-secondary" id="scanBtn">📷 Сканувати</button>
    </div>
    <div id="barcode-wrap">
      <svg id="barcode"></svg>
      <div class="row">
        <button class="btn-secondary" id="saveImgBtn">Зберегти зображення</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>Історія</span>
      <span id="clearHist" style="cursor:pointer;">Очистити</span>
    </div>
    <input type="text" id="historySearch" class="search-input" placeholder="Пошук в історії…">
    <div id="history"></div>
  </div>
</main>

<div id="scan-overlay">
  <div class="scan-bar">
    <span>Наведіть на штрихкод</span>
    <button class="scan-close" id="closeScan">✕</button>
  </div>
  <video id="scan-video" playsinline autoplay muted disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback nofullscreen"></video>
  <div class="scan-frame"></div>
  <div class="scan-hint">Код 128 · тримайте телефон рівно</div>
  <div class="scan-ocr-bar">
    <button class="btn-ocr" id="ocrBtn">Не сканується? Розпізнати текст</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="JsBarcode.all.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const input = $('input');
const barcodeWrap = $('barcode-wrap');
const barcodeSvg = $('barcode');
const historyEl = $('history');
const toast = $('toast');

const STORAGE_KEY = 'barcode128_history';

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveHistory(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function addHistory(text, source){
  const list = loadHistory();
  list.unshift({ text, source, ts: Date.now() });
  saveHistory(list.slice(0,200));
  renderHistory();
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('uk-UA') + ' ' + d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
}
function renderHistory(){
  const list = loadHistory();
  const query = ($('historySearch').value || '').trim().toLowerCase();
  const filtered = query
    ? list.map((item, i) => ({item, i})).filter(({item}) => item.text.toLowerCase().includes(query))
    : list.map((item, i) => ({item, i}));

  if(!list.length){
    historyEl.innerHTML = '<div class="empty">Поки що порожньо</div>';
    return;
  }
  if(!filtered.length){
    historyEl.innerHTML = '<div class="empty">Нічого не знайдено</div>';
    return;
  }
  historyEl.innerHTML = filtered.map(({item, i}) => `
    <div class="hist-item">
      <div>
        <div class="hist-text">${escapeHtml(item.text)}</div>
        <span class="hist-time">${item.source === 'scan' ? '📷 скан · ' : ''}${fmtTime(item.ts)}</span>
      </div>
      <div class="hist-actions">
        <button class="icon-btn" onclick="useHistoryItem(${i})" aria-label="Використати">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" onclick="deleteHistoryItem(${i})" aria-label="Видалити">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}
$('historySearch').addEventListener('input', renderHistory);
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
window.useHistoryItem = i => {
  const list = loadHistory();
  const item = list[i];
  if(!item) return;
  input.value = item.text;
  generateBarcode(item.text, false);
};
window.deleteHistoryItem = i => {
  const list = loadHistory();
  list.splice(i,1);
  saveHistory(list);
  renderHistory();
};
$('clearHist').onclick = () => {
  if(confirm('Очистити всю історію?')){
    saveHistory([]);
    renderHistory();
  }
};

function generateBarcode(text, addToHist=true, source='manual'){
  if(!text || !text.trim()){
    showToast('Введіть текст');
    return;
  }
  try{
    JsBarcode(barcodeSvg, text, {
      format: 'CODE128',
      lineColor: '#000',
      width: 2,
      height: 90,
      displayValue: true,
      fontSize: 14,
      margin: 8
    });
    barcodeWrap.classList.add('show');
    if(addToHist) addHistory(text, source);
  }catch(e){
    showToast('Не вдалося створити код: ' + e.message);
  }
}

$('genBtn').onclick = () => generateBarcode(input.value, true, 'manual');

$('saveImgBtn').onclick = () => {
  const svgData = new XMLSerializer().serializeToString(barcodeSvg);
  const canvas = document.createElement('canvas');
  const img = new Image();
  const svgBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const SCALE = 8; // вища роздільність для чіткого друку/сканування
  img.onload = () => {
    canvas.width = img.width * SCALE;
    canvas.height = img.height * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'barcode-' + Date.now() + '.png';
      a.click();
    }, 'image/png');
  };
  img.src = url;
};

/* ---- Scanner ---- */
let scanStream = null;
let scanRAF = null;
let zxingReader = null;
let zxingLoadPromise = null;

function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}

function onScanResult(text){
  input.value = text;
  generateBarcode(text, true, 'scan');
  showToast('Знайдено: ' + text);
  stopScan();
}

async function startCamera(){
  const constraints = { video: { facingMode: { ideal: 'environment' } } };
  scanStream = await navigator.mediaDevices.getUserMedia(constraints);
  const video = $('scan-video');
  video.srcObject = scanStream;
  await video.play();
  return video;
}

async function scanWithNativeDetector(video){
  const detector = new window.BarcodeDetector({
    formats: ['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code']
  });
  const tick = async () => {
    if(!scanStream) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length){
        onScanResult(codes[0].rawValue);
        return;
      }
    }catch(e){ /* ignore single-frame errors */ }
    scanRAF = requestAnimationFrame(tick);
  };
  tick();
}

async function scanWithZXing(video){
  await loadZXing();
  zxingReader = new ZXing.BrowserMultiFormatReader();
  await zxingReader.decodeFromVideoElement(video, (result) => {
    if(result) onScanResult(result.getText());
  });
}

/* ---- OCR резерв (для пошкоджених штрихкодів) — повністю локально, без інтернету ---- */
let tesseractLoadPromise = null;
let ocrRunning = false;

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'ocr/tesseract.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}

function captureVideoFrame(video){
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas;
}

$('ocrBtn').onclick = async () => {
  if(ocrRunning) return;
  const video = $('scan-video');
  if(!scanStream || !video.videoWidth){
    showToast('Камера ще не готова');
    return;
  }
  ocrRunning = true;
  const btn = $('ocrBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Завантаження OCR…';
  try{
    await loadTesseract();
    btn.textContent = 'Розпізнаю текст…';
    const canvas = captureVideoFrame(video);
    const result = await Tesseract.recognize(canvas, 'eng', {
      workerPath: 'ocr/worker.min.js',
      corePath: 'ocr/',
      langPath: 'ocr/',
      gzip: true,
      tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. '
    });
    const text = (result.data.text || '').replace(/\s+/g, ' ').trim();
    if(!text){
      showToast('Не вдалося розпізнати текст — спробуй ближче/чіткіше');
    }else{
      input.value = text;
      showToast('Розпізнано: ' + text + ' — перевір і натисни "Створити код"');
      stopScan();
    }
  }catch(e){
    showToast('Помилка OCR: ' + (e && e.message ? e.message : 'спробуй ще раз'));
  }finally{
    ocrRunning = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

$('scanBtn').onclick = async () => {
  $('scan-overlay').classList.add('show');
  try{
    const video = await startCamera();
    if('BarcodeDetector' in window){
      await scanWithNativeDetector(video);
    }else{
      await scanWithZXing(video);
    }
  }catch(e){
    showToast(e.name === 'NotAllowedError' ? 'Дозволь доступ до камери в налаштуваннях' : 'Немає доступу до камери');
    stopScan();
  }
};

function stopScan(){
  $('scan-overlay').classList.remove('show');
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
$('closeScan').onclick = stopScan;

renderHistory();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
